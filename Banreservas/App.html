<style>
  /* El scroll SOLO vive en este contenedor */
  .scroll-zone {
    overflow: hidden;          /* JS controla el scroll, no el browser */
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: #ffffff;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
 
  .scroll-zone.grabbing {
    cursor: grabbing;
  }
 
  /* El inner se mueve con transform via JS */
  .scroll-inner {
    will-change: transform;
    transform: translateY(0px);
    transition: none; /* JS maneja la inercia */
  }
 
  /* Sombra sutil que indica que hay más contenido abajo */
  .scroll-zone::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 24px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.9));
    pointer-events: none;
    z-index: 2;
  }
</style>

<script>
  const zone  = document.getElementById('scrollZone');
  const inner = document.getElementById('scrollInner');
 
  let currentY   = 0;   // posición actual del inner
  let targetY    = 0;   // posición objetivo (donde queremos llegar)
  let velocityY  = 0;   // velocidad actual (para inercia)
  let rafId      = null;
 
  // Variables de arrastre (mouse/touch)
  let isDragging = false;
  let startPointerY = 0;
  let startScrollY  = 0;
  let lastPointerY  = 0;
  let lastTime      = 0;
  let dragVelocity  = 0;
 
  /* ---- Límites de scroll ---- */
  function getMaxScroll() {
    return Math.max(0, inner.scrollHeight - zone.clientHeight);
  }
 
  /* ---- Clamp con rebote suave ---- */
  function clamp(val, min, max) {
    if (val < min) return min + (val - min) * 0.25;  // rebote arriba
    if (val > max) return max + (val - max) * 0.25;  // rebote abajo
    return val;
  }
 
  /* ---- Loop de animación con inercia ---- */
  function animate() {
    const maxScroll = getMaxScroll();
 
    // Interpolación suave hacia targetY
    const diff = targetY - currentY;
    velocityY = diff * 0.12 + velocityY * 0.0; // spring hacia target
 
    if (!isDragging) {
      // Inercia libre: velocidad decae
      targetY += velocityY;
      velocityY *= 0.88;
 
      // Rebote de vuelta si pasa los límites
      if (targetY < 0)         targetY += (0 - targetY)         * 0.18;
      if (targetY > maxScroll) targetY += (maxScroll - targetY) * 0.18;
    }
 
    currentY = currentY + (targetY - currentY) * 0.18;
 
    // Clamp visual para no salirse demasiado
    const displayY = -clamp(currentY, 0, maxScroll);
    inner.style.transform = `translateY(${displayY}px)`;
 
    // Seguir animando si hay movimiento
    const moving = Math.abs(targetY - currentY) > 0.1 || Math.abs(velocityY) > 0.1;
    if (moving) {
      rafId = requestAnimationFrame(animate);
    } else {
      rafId = null;
    }
  }
 
  function startAnimate() {
    if (!rafId) rafId = requestAnimationFrame(animate);
  }
 
  /* ---- EVENTOS TOUCH (móvil) ---- */
  zone.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    isDragging     = true;
    startPointerY  = touch.clientY;
    startScrollY   = currentY;
    lastPointerY   = touch.clientY;
    lastTime       = Date.now();
    dragVelocity   = 0;
    velocityY      = 0;
    zone.classList.add('grabbing');
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }, { passive: true });
 
  zone.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const touch = e.touches[0];
    const now   = Date.now();
    const dt    = now - lastTime || 1;
 
    dragVelocity  = (lastPointerY - touch.clientY) / dt * 16;
    lastPointerY  = touch.clientY;
    lastTime      = now;
 
    const delta = startPointerY - touch.clientY;
    const maxScroll = getMaxScroll();
    targetY = clamp(startScrollY + delta, 0, maxScroll);
    currentY = targetY;
 
    inner.style.transform = `translateY(${-currentY}px)`;
  }, { passive: false });
 
  zone.addEventListener('touchend', () => {
    isDragging = false;
    zone.classList.remove('grabbing');
    velocityY = dragVelocity * 6;   // impulso inicial de inercia
    targetY += velocityY;
    startAnimate();
  });
 
  /* ---- EVENTOS MOUSE (desktop) ---- */
  zone.addEventListener('mousedown', (e) => {
    isDragging    = true;
    startPointerY = e.clientY;
    startScrollY  = currentY;
    lastPointerY  = e.clientY;
    lastTime      = Date.now();
    dragVelocity  = 0;
    velocityY     = 0;
    zone.classList.add('grabbing');
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    e.preventDefault();
  });
 
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const now = Date.now();
    const dt  = now - lastTime || 1;
 
    dragVelocity = (lastPointerY - e.clientY) / dt * 16;
    lastPointerY = e.clientY;
    lastTime     = now;
 
    const delta = startPointerY - e.clientY;
    const maxScroll = getMaxScroll();
    targetY  = clamp(startScrollY + delta, 0, maxScroll);
    currentY = targetY;
 
    inner.style.transform = `translateY(${-currentY}px)`;
  });
 
  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    zone.classList.remove('grabbing');
    velocityY = dragVelocity * 6;
    targetY  += velocityY;
    startAnimate();
  });
 
  /* ---- RUEDA DEL MOUSE ---- */
  zone.addEventListener('wheel', (e) => {
    e.preventDefault();
    const maxScroll = getMaxScroll();
    targetY = Math.max(0, Math.min(maxScroll, targetY + e.deltaY * 0.8));
    velocityY = 0;
    startAnimate();
  }, { passive: false });
</script>
